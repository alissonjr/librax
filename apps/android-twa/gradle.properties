org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------------------------
# Librax: o que muda entre ambientes. Tudo pode ser trocado na linha de comando com -P, sem editar:
#   ./gradlew assembleDebug -Plibrax.host=192.168.1.104 -Plibrax.port=4443
# Ver README.md.
# ---------------------------------------------------------------------------------------------

# Id do pacote na Play Store. Depois da primeira publicação nunca mais muda. Precisa ser o mesmo de
# librax:androidPackageName no CDK (infra/cdk.json), que gera o assetlinks.json.
librax.applicationId=br.com.librax.app

# Domínio do app (o mesmo de librax:appDomainName no CDK). librax.example é placeholder.
librax.host=app.librax.example
# Porta, só para teste local (ex.: 4443). Vazio em produção.
librax.port=

# Caminho de abertura. O ?origem=android avisa o site que ele está dentro do app Android
# (apps/web-poc/src/lib/twa.ts): some o convite de instalar.
librax.launchPath=/?origem=android

# Nome embaixo do ícone e nome do app nas configurações do Android
librax.appName=Librax

# Versão: versionCode sobe 1 a cada envio para a Play Store (só quando a casca muda).
librax.versionCode=1
librax.versionName=1.0.0

# Notificações do site (lembretes do Web Push) aparecem como do app, e não do Chrome
librax.enableNotifications=true
